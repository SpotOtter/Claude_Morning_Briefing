<title>Mossy Head Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a highway-sign field guide for one driver's shift.
   Asphalt masthead with a dashed center line, a single verdict card first,
   then weather timeline, road closures, headlines. Barlow is the typeface family
   the US highway-sign tradition inspired; yellow is used only as the road marking. */
:root {
  --bg: #E7E9EC;
  --surface: #F8F9FA;
  --ink: #1B1F24;
  --muted: #5A626C;
  --line: #D2D6DB;
  --road: #23272D;
  --road-ink: #F2F3F5;
  --road-muted: #A9B0B9;
  --mark: #F2B705;
  --good: #1D7A4B;
  --good-bg: #DCEFE4;
  --warn: #9A5200;
  --warn-bg: #FBE9CC;
  --bad: #B3261E;
  --bad-bg: #F9DAD7;
  --rain: #2B6CB0;
  --rain-soft: #CFE0F3;
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519;
    --surface: #1C2025;
    --ink: #E8EAED;
    --muted: #98A1AB;
    --line: #2C3238;
    --road: #0C0E11;
    --road-ink: #F2F3F5;
    --road-muted: #8F98A2;
    --mark: #F2B705;
    --good: #5AC993;
    --good-bg: #173024;
    --warn: #F2A545;
    --warn-bg: #3A2A12;
    --bad: #FF7168;
    --bad-bg: #3D1B19;
    --rain: #5DA4EA;
    --rain-soft: #1E3550;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519;
  --surface: #1C2025;
  --ink: #E8EAED;
  --muted: #98A1AB;
  --line: #2C3238;
  --road: #0C0E11;
  --road-ink: #F2F3F5;
  --road-muted: #8F98A2;
  --mark: #F2B705;
  --good: #5AC993;
  --good-bg: #173024;
  --warn: #F2A545;
  --warn-bg: #3A2A12;
  --bad: #FF7168;
  --bad-bg: #3D1B19;
  --rain: #5DA4EA;
  --rain-soft: #1E3550;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

/* Masthead */
.mast {
  background: var(--road);
  color: var(--road-ink);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) 26px max(16px, env(safe-area-inset-left, 0px));
  position: relative;
}
.mast::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 10px; height: 3px;
  background: repeating-linear-gradient(90deg, var(--mark) 0 22px, transparent 22px 38px);
}
.mast-in { max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 16px; padding-bottom: 14px; }
.mast .place { font: 600 14px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--road-muted); margin: 0 0 8px; }
.mast h1 { font: 700 clamp(38px, 9vw, 56px)/.95 var(--font-display); text-transform: uppercase; letter-spacing: .01em; margin: 0; text-wrap: balance; }
.mast .stamp { font: 500 14px/1.3 var(--font-body); color: var(--road-muted); text-align: right; font-variant-numeric: tabular-nums; }

h2 { font: 700 22px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 small { font: 500 13px/1 var(--font-body); letter-spacing: 0; text-transform: none; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

/* Verdict */
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 0; padding: 0; overflow: hidden; }
.verdict .badge { display: flex; align-items: center; justify-content: center; padding: 14px 16px; font: 700 26px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; writing-mode: horizontal-tb; min-width: 96px; text-align: center; }
.verdict .body { padding: 14px 16px; min-width: 0; }
.verdict .body h3 { font: 700 26px/1.05 var(--font-display); margin: 0 0 6px; text-wrap: balance; }
.verdict .body p { margin: 0; color: var(--muted); }
.v-clear .badge { background: var(--good-bg); color: var(--good); }
.v-watch .badge { background: var(--warn-bg); color: var(--warn); }
.v-stop  .badge { background: var(--bad-bg);  color: var(--bad); }

/* Weather */
.now { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: flex-end; margin-bottom: 14px; }
.hi { font: 700 76px/.85 var(--font-display); font-variant-numeric: tabular-nums; }
.hi sup { font-size: 34px; vertical-align: top; position: relative; top: 4px; }
.lohi { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 15px; }
.lohi strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.sky { font: 600 20px/1.2 var(--font-display); letter-spacing: .02em; text-transform: uppercase; flex-basis: 100%; }

.sample-tag { display: inline-block; font: 600 12px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn); padding: 5px 8px; border-radius: 4px; }

.radar img { display: block; width: 100%; height: auto; border-radius: 6px; background: #000; }
.radar .cap { margin-top: 8px; font-size: 13px; color: var(--muted, #666); }
.scroller { overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; -webkit-overflow-scrolling: touch; }
.hours { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(46px, 1fr); gap: 0; min-width: 100%; width: max-content; }
.hr { display: grid; grid-template-rows: auto 64px auto auto auto auto; justify-items: center; align-items: end; padding: 6px 0; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hr:first-child { border-left: 0; }
.hr .t { font: 600 13px/1 var(--font-body); color: var(--muted); padding-bottom: 6px; }
.hr .bar { width: 22px; background: var(--rain); border-radius: 3px 3px 0 0; min-height: 3px; }
.hr .pct { font: 600 12px/1 var(--font-body); color: var(--rain); padding-top: 4px; }
.hr .deg { font: 700 22px/1 var(--font-display); padding-top: 8px; }
.hr .wind { font: 500 12px/1.2 var(--font-body); color: var(--muted); padding-top: 4px; text-align: center; }
.hr .tag { font: 600 10px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; padding: 3px 4px; border-radius: 3px; min-height: 16px; }
.tag.storm { background: var(--warn-bg); color: var(--warn); }
.tag.fog { background: var(--rain-soft); color: var(--rain); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { border-top: 2px solid var(--line); padding-top: 8px; min-width: 0; }
.fact dt { font: 600 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.fact dd { margin: 0; font: 700 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.fact dd.na { color: var(--muted); font-weight: 600; font-size: 18px; }
.fact dd small { display: block; font: 400 13px/1.3 var(--font-body); color: var(--muted); margin-top: 3px; }

.alerts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { font: 600 14px/1 var(--font-body); padding: 8px 10px; border-radius: 6px; }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.w { background: var(--warn-bg); color: var(--warn); }
.chip.b { background: var(--bad-bg); color: var(--bad); }

/* Roads */
.roads { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.road { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.shield { min-width: 54px; text-align: center; font: 700 20px/1 var(--font-display); padding: 8px 6px; border-radius: 6px 6px 14px 14px; background: var(--road); color: var(--road-ink); border: 2px solid var(--road-ink); }
.road h3 { font: 600 17px/1.25 var(--font-body); margin: 0 0 3px; }
.road p { margin: 0; color: var(--muted); font-size: 15px; }
.when { display: inline-block; font: 700 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; margin-right: 8px; vertical-align: 2px; background: var(--bad-bg); color: var(--bad); }
.empty { display: flex; gap: 12px; align-items: center; color: var(--muted); }
.empty strong { color: var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { font: 600 14px/1 var(--font-body); text-decoration: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.btn:hover { border-color: var(--muted); }

/* Map */
.mapbox { overflow-x: auto; margin: 0 -16px 10px; padding: 0 16px 4px; -webkit-overflow-scrolling: touch; }
.map { display: block; width: 100%; min-width: 600px; height: auto; border-radius: 8px; border: 1px solid var(--line); }
.gmapbox { overflow: visible; }
.gmap { width: 100%; height: 420px; border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
@media (max-width: 600px) { .gmap { height: 340px; } }
.m-land { fill: var(--bg); }
.m-water { fill: var(--rain-soft); }
.m-state { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 7 6; fill: none; }
.m-ring { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 6; opacity: .8; }
.m-i { stroke: var(--ink); stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.m-r { stroke: var(--muted); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.m-town { fill: var(--ink); }
.m-lab { font: 500 13px var(--font-body); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.m-home { font: 700 15px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.m-sea { font: italic 500 14px var(--font-body); fill: var(--rain); }
.m-shield rect { fill: var(--road); stroke: var(--road-ink); stroke-width: 1.5; }
.m-shield text { font: 700 12px var(--font-display); fill: var(--road-ink); }
.m-pin-closure { fill: var(--bad); }
.m-pin-crash { fill: var(--warn); }
.m-pin { stroke: var(--surface); stroke-width: 2.5; }
.m-pinnum { font: 700 14px var(--font-body); fill: var(--surface); }
.m-note { font: 500 11px var(--font-body); fill: var(--muted); }
.maplegend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin: 0 0 16px; }
.lg-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.lg-dot.closure { background: var(--bad); }
.lg-dot.crash { background: var(--warn); }
.num { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font: 700 13px/1 var(--font-body); margin-right: 8px; vertical-align: 1px; color: var(--surface); background: var(--bad); }
.num.crash { background: var(--warn); }
.when.crash { background: var(--warn-bg); color: var(--warn); }

.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tips li { padding: 12px 0; border-top: 1px solid var(--line); }
.tips li:first-child { border-top: 0; padding-top: 0; }
.tips li:last-child { padding-bottom: 0; }
.tips .th { font: 700 17px/1.2 var(--font-body); margin: 0 0 3px; }
.tips p { margin: 0; color: var(--muted); font-size: 15px; }
.basis { font: 600 12px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; background: var(--warn-bg); color: var(--warn); padding: 5px 8px; border-radius: 4px; }
.basis.rand { background: var(--good-bg); color: var(--good); }
/* Headlines */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news li { padding: 12px 0; border-top: 1px solid var(--line); }
.news li:first-child { border-top: 0; padding-top: 0; }
.news li:last-child { padding-bottom: 0; }
.news a { text-decoration: none; }
.news a:hover h3 { text-decoration: underline; }
.news h3 { font: 600 18px/1.25 var(--font-body); margin: 0 0 4px; text-wrap: balance; }
.news p { margin: 0; color: var(--muted); font-size: 15px; }
.news .src { font: 600 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; display: block; }

footer { color: var(--muted); font-size: 13px; line-height: 1.5; }
@media (max-width: 460px) {
  .verdict { grid-template-columns: 1fr; }
  .verdict .badge { justify-content: flex-start; padding: 10px 16px; font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .2s; }
}
</style>

    var LON0 = -87.4, LAT1 = 31.4, K = 380, CX = Math.cos(30.8 * Math.PI / 180);
    function P(lon, lat) { return [(lon - LON0) * CX * K, (LAT1 - lat) * K]; }
